name: Reusable TruffleHog Scan

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      depth:
        required: false
        type: number
        default: 2
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL_ID_GITHUB_NOTIFICATION:
        required: true

# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  SecurityScan:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      DEPTH: ${{ inputs.depth }}
    steps:

      - name: Checkout the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: ${{ env.DEPTH }}

      - name: Run TruffleHog Scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # The wrapper pulls the scanner image tagged "latest" unless pinned here.
          version: "3.96.0"
          extra_args: --results=verified

      - name: Send notification to slack if secrets found
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID_GITHUB_NOTIFICATION }}
          payload: |
            {
              "text": "TruffleHog scan detected secrets in ${{
                github.repository }}. Please review the action logs.",
              "blocks": [
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *Alert:* TruffleHog detected secrets in ${{
                      github.repository }}. [View details](https://github.com/${{
                      github.repository }}/actions/runs/${{ github.run_id }})"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
