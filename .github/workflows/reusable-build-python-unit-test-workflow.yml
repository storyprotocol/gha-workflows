name: Build and Test

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      ENVIRONMENT:
        required: true
        type: string
    secrets:
      WALLET_PRIVATE_KEY:
        required: true
      RPC_PROVIDER_URL:
        required: true

jobs:
  build_and_test:
    name: Build and Test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
      RPC_PROVIDER_URL: ${{ secrets.RPC_PROVIDER_URL }}

    steps:
      - name: Check out code
        # Keep on v4.3.1: v4.4.0 backports the allow-unsafe-pr-checkout breaking change,
        # which rejects fork-SHA checkout for pull_request_target callers (sdk pr-external.yaml).
        # Bump only together with an explicit opt-in input threaded to this checkout step.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # Caches pip dependencies

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt || exit 1
          pip install pytest pytest-cov  # Common testing packages
        shell: bash

      - name: Run Unit tests
        run: |
          source .venv/bin/activate 
          pytest tests/unit/ --cov=./ --cov-report=xml